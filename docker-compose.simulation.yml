# DNS Shield — SIMULAÇÃO / DEMO (Mac, Linux e Windows)
#
# Sobe o fluxo completo SEM precisar de Raspberry Pi nem acesso à LAN física:
#   1. cloud-backend : API NestJS (SQLite local)            -> http://localhost:3000
#   2. pihole        : servidor DNS + painel admin          -> http://localhost:8080/admin
#   3. edge-discovery: varre uma topologia de clínica (sim) e envia ao backend
#
# IMPORTANTE (demo honesta): no Raspberry Pi real o Pi-hole roda em
# network_mode "host" e assume o DHCP da rede. No Docker Desktop (Mac/Windows)
# isso NÃO é possível — o Docker roda numa VM isolada, sem acesso de camada 2
# à sua rede. Por isso a simulação usa uma topologia fictícia (--simulate) e o
# Pi-hole roda em modo bridge só para demonstrar DNS + painel.

services:
  cloud-backend:
    build:
      context: ./cloud-backend
      dockerfile: Dockerfile
    container_name: dns-shield-backend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_PATH: "/app/data/dns-shield.db"
      # IA local (Llama via Ollama). Ative com o profile 'ai' (ver README).
      # Privacidade: a inferência roda localmente; nada sai do dispositivo.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_URL: "http://ollama:11434"
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pihole:
    image: pihole/pihole:latest
    container_name: dns-shield-pihole
    # Modo bridge para a demo (DHCP real só funciona no Pi em network_mode host).
    ports:
      - "8080:80/tcp"     # painel admin -> http://localhost:8080/admin
      - "5353:53/tcp"     # DNS (porta alta para não conflitar com o host)
      - "5353:53/udp"
    environment:
      TZ: "America/Sao_Paulo"
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-changeme}
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - pihole-etc:/etc/pihole
    restart: unless-stopped

  edge-discovery:
    build:
      context: ./edge-node
      dockerfile: Dockerfile.discovery
    container_name: dns-shield-discovery
    environment:
      TENANT_ID: "clinica-demo"
      CLOUD_API_URL: "http://cloud-backend:3000/api"
      SIMULATE: "true"
      SEND: "true"
      SEND_RETRIES: "15"
    depends_on:
      cloud-backend:
        condition: service_started
    # Roda uma vez, envia a topologia e encerra.
    restart: "no"

  # Reporter: lê as estatísticas REAIS do Pi-hole e envia ao backend, para o
  # bloqueio aparecer no painel. Gera algumas consultas de demonstração antes,
  # para que haja números para exibir (inclui domínios de anúncio = bloqueados).
  edge-reporter:
    build:
      context: ./edge-node
      dockerfile: Dockerfile.discovery
    container_name: dns-shield-reporter
    environment:
      TENANT_ID: "clinica-demo"
      CLOUD_API_URL: "http://cloud-backend:3000/api"
      PIHOLE_URL: "http://pihole:80"
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:-changeme}
      REPORT_INTERVAL: "30"
    entrypoint:
      - sh
      - -c
      - |
        echo "[reporter] aguardando Pi-hole..."
        sleep 25
        # Gera tráfego de demo: sites normais + domínios de anúncio (bloqueados).
        for d in github.com google.com wikipedia.org doubleclick.net ads.google.com googlesyndication.com doubleclick.net ads.google.com; do
          nslookup "$$d" pihole >/dev/null 2>&1 || true
        done
        python3 pihole_reporter.py
    depends_on:
      cloud-backend:
        condition: service_started
      pihole:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dns-shield-frontend
    ports:
      - "8088:80"     # painel do cliente -> http://localhost:8088
    depends_on:
      - cloud-backend
    restart: unless-stopped

  # IA LOCAL (Llama via Ollama) — opcional, só sobe com o profile "ai":
  #   docker compose -f docker-compose.simulation.yml --profile ai up -d
  # Privacidade por design: a análise da rede roda aqui, no próprio ambiente do
  # cliente. Nenhum dado de rede é enviado a nuvens de terceiros.
  ollama:
    image: ollama/ollama:latest
    container_name: dns-shield-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Baixa o modelo Llama no primeiro start e mantém o servidor rodando.
    entrypoint:
      - sh
      - -c
      - |
        ollama serve &
        sleep 5
        ollama pull "$${LLM_MODEL:-llama3.2}" || true
        wait
    environment:
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
    restart: unless-stopped

volumes:
  backend-data:
  pihole-etc:
  ollama-models:
