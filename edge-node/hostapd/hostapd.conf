# DNS Shield — Configuração do Access Point (hostapd)
# Transforma o Raspberry Pi num ponto de acesso Wi-Fi próprio.
# Qualquer dispositivo que conectar nesta rede usa automaticamente o Pi-hole
# como DNS — sem precisar tocar no modem da operadora.

# Interface Wi-Fi do Pi (rádio interno dos Pi 3/4/5 é wlan0).
interface=wlan0

# Driver padrão para o chip Wi-Fi do Raspberry Pi.
driver=nl80211

# Nome da rede que o cliente vai ver e conectar.
ssid=DNS-Shield

# Banda 2.4GHz (maior alcance e compatibilidade; o Pi 2 só suporta 2.4).
hw_mode=g
channel=7

# Padrões de compatibilidade.
ieee80211n=1
wmm_enabled=1

# --- Segurança (WPA2) ---
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# Senha da rede Wi-Fi protegida. TROQUE por cliente no provisionamento.
wpa_passphrase=mude-esta-senha

# Não esconder o SSID (facilita o onboarding plug-and-play).
ignore_broadcast_ssid=0
